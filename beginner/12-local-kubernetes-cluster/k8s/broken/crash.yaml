# Broken on purpose (debugging lab): the app starts, then exits with an error.
# Expected: Error -> CrashLoopBackOff, RESTARTS climbing
# (It runs ~3 s before failing, like a real app checking its config; a container that
#  dies in milliseconds is removed so fast that even `kubectl logs --previous` can't read it.)
apiVersion: v1
kind: Pod
metadata:
  name: crash
  namespace: web
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo 'starting...'; sleep 3; echo 'ERROR: DATABASE_URL is not set' >&2; exit 1"]
