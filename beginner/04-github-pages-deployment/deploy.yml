# Standalone version of the workflow, for a repo that has index.html at its root
# (e.g. a separate "gh-deployment-workflow" repo as in the brief).
# Copy it to .github/workflows/deploy.yml in that repo.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["index.html"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
