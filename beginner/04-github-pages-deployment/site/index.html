<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello, GitHub Actions!</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0d1117; color: #e6edf3; text-align: center;
    }
    main { padding: 2rem; }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); margin: 0 0 .5rem; }
    p { color: #8b949e; margin: .25rem 0; }
    code { background: #161b22; padding: .15rem .4rem; border-radius: 6px; color: #7ee787; }
  </style>
</head>
<body>
  <main>
    <h1>Hello, GitHub Actions! 🚀</h1>
    <p>Deployed automatically to GitHub Pages by a GitHub Actions workflow.</p>
    <p>Commit <code>{{COMMIT}}</code> · built {{BUILD_TIME}}</p>
  </main>
</body>
</html>
