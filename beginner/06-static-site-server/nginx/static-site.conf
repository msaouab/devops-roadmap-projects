# /etc/nginx/sites-available/static-site   (Debian/Ubuntu)
# /etc/nginx/conf.d/static-site.conf       (Fedora/RHEL/Alpine)
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # replaced by setup-server.sh with your domain, or "_" = any host/IP
    server_name _;

    root  /var/www/static-site;
    index index.html;

    # serve the file, a folder's index.html, or a 404
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;

    # cache static assets in the browser for 7 days
    location ~* \.(css|js|svg|png|jpe?g|gif|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # compress text responses
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    # never serve hidden files like .git or .env
    location ~ /\. { deny all; }
}
