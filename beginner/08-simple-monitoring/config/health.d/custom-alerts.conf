# Custom alerts (project 08). Installed to <netdata-config>/health.d/
# Reload without restarting: sudo netdatacli reload-health

# CPU busy (user + system + irq) averaged over the last minute
 alarm: custom_cpu_usage_high
    on: system.cpu
lookup: average -1m unaligned of user,system,softirq,irq,guest
 units: %
 every: 10s
  warn: $this > 80
  crit: $this > 95
 delay: down 1m
  info: average CPU usage over the last minute
    to: sysadmin

# RAM used, as a percentage of total
 alarm: custom_ram_usage_high
    on: system.ram
  calc: $used * 100 / ($used + $cached + $free + $buffers)
 units: %
 every: 10s
  warn: $this > 80
  crit: $this > 95
  info: percentage of RAM in use
    to: sysadmin
