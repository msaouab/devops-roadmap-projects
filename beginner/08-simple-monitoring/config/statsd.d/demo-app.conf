# Custom dashboard section (project 08): a "Demo App" menu with 2 charts,
# fed by StatsD metrics that test_dashboard.sh sends to UDP port 8125.
[app]
    name = demo_app
    metrics = demoapp.*
    private charts = no
    gaps when not collected = no

[dictionary]
    demoapp.requests = requests
    demoapp.errors = errors
    demoapp.latency = latency

[requests]
    name = requests
    title = Demo App - requests and errors
    family = traffic
    context = demoapp.requests
    units = events/s
    type = area
    dimension = demoapp.requests requests last 1 1
    dimension = demoapp.errors errors last 1 1

[latency]
    name = latency
    title = Demo App - response time
    family = performance
    context = demoapp.latency
    units = ms
    type = line
    dimension = demoapp.latency average average 1 1
